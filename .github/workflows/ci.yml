name: CI Matrix

on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  workflow_dispatch:

jobs:
  cpp:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with: { cmake-version: '3.29.3' }
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DSPATIAL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sanitizers (Linux Debug)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Debug'
        run: cmake -S . -B build-san -DSPATIAL_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug && cmake --build build-san && ctest --test-dir build-san

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20.18.1', cache: 'npm', cache-dependency-path: apps/desktop/frontend/package-lock.json }
      - run: npm ci --prefix apps/desktop/frontend --legacy-peer-deps
      - run: npm run build --prefix apps/desktop/frontend
      - run: npx --prefix apps/desktop/frontend vitest run --config vitest.config.ts
      - run: npx --prefix apps/desktop/frontend playwright install chromium --with-deps
      - run: npx --prefix apps/desktop/frontend playwright test --config=playwright.config.ts --workers=1
      - run: npx --prefix apps/desktop/frontend playwright test --config=playwright.a11y.config.ts --workers=1
      - uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/desktop/frontend/playwright-report }

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: clang-tidy --version || true
      - run: clang-tidy engine/**/*.cpp --checks='*,-fuchsia*' --warnings-as-errors='*' || true
      - run: npx --prefix apps/desktop/frontend eslint . --max-warnings 0

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/super-linter@v7
      - uses: anchore/sbom-action@v0
      - run: npm audit --prefix apps/desktop/frontend

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cpp, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset release && cmake --build build/release && ctest --test-dir build/release
      - run: npm --prefix apps/desktop/frontend run build
      - uses: softprops/action-gh-release@v2
        with: { files: "build/release/apps/cli/spatial_cli\napps/desktop/frontend/dist/**\nsbom.json" }
